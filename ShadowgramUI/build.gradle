plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace 'com.github.borz7zy.shadowgram.shadowgramui'
    compileSdk 36

    defaultConfig {
        minSdk 33

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // Core layer. `api` so the app module can still reach AppManager/AccountSession
    // without declaring SharedUtils itself.
    api project(':SharedUtils')

    implementation project(':rlottie')
    implementation project(':ffmpeg')
    implementation project(':SlidingMenu')
    implementation project(':LibMonet')
    api project(':tdlib')

    implementation libs.appcompat
    implementation libs.material
    implementation libs.core
    implementation libs.recyclerview
    implementation libs.constraintlayout
    implementation libs.fragment
    implementation libs.preference
    implementation libs.dynamicanimation
    implementation libs.legacy.support.v4

    api libs.lifecycle.livedata
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.runtime

    api libs.navigation.fragment
    api libs.navigation.ui

    implementation libs.waveform.seekbar
    implementation libs.amplituda
    implementation libs.paging.runtime

    implementation libs.glide
    annotationProcessor libs.glide.compiler

    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}
