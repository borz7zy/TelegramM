name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Generate local.properties
        shell: powershell
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          if (-Not $env:API_ID) { Write-Error "API_ID secret not set"; exit 1 }
          if (-Not $env:API_HASH) { Write-Error "API_HASH secret not set"; exit 1 }

          $sdkDir = $env:ANDROID_HOME
          if (-Not $sdkDir) {
            Write-Error "ANDROID_HOME not set on runner"
            exit 1
          }

          @"
          sdk.dir=$sdkDir
          api_id=$env:API_ID
          api_hash=$env:API_HASH
          "@ | Out-File -Encoding utf8 local.properties

      - name: Check gradlew
        shell: powershell
        run: |
          if (-Not (Test-Path "gradlew.bat")) {
            Write-Error "gradlew.bat not found!"
            exit 1
          }

      - name: Build Debug and Release
        shell: powershell
        run: .\gradlew.bat clean assembleDebug assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/**/release/*.apk
          if-no-files-found: warn

  telegram:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: apk

      - name: Upload to Yandex Disk and get public link
        id: yandex
        env:
          YD_TOKEN: ${{ secrets.YANDEX_TOKEN }}
        run: |
          set -e

          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          BASE_PATH="TelegramM/$SHORT_SHA"

          curl -X PUT -s -H "Authorization: OAuth $YD_TOKEN" \
            "https://cloud-api.yandex.net/v1/disk/resources?path=TelegramM" || true

          curl -X PUT -H "Authorization: OAuth $YD_TOKEN" \
            "https://cloud-api.yandex.net/v1/disk/resources?path=$BASE_PATH"

          for file in $(find apk -type f -name "*.apk"); do
            FILE_NAME=$(basename "$file")
          
            echo "Uploading $FILE_NAME..."

            UPLOAD_URL=$(curl -s -H "Authorization: OAuth $YD_TOKEN" \
              "https://cloud-api.yandex.net/v1/disk/resources/upload?path=$BASE_PATH/$FILE_NAME&overwrite=true" \
              | jq -r '.href')

            curl -T "$file" "$UPLOAD_URL"
          done

          curl -X PUT -H "Authorization: OAuth $YD_TOKEN" \
            "https://cloud-api.yandex.net/v1/disk/resources/publish?path=$BASE_PATH"

          PUBLIC_URL=$(curl -s -H "Authorization: OAuth $YD_TOKEN" \
            "https://cloud-api.yandex.net/v1/disk/resources?path=$BASE_PATH" \
            | jq -r '.public_url')

          echo "PUBLIC_URL=$PUBLIC_URL" >> $GITHUB_OUTPUT

      - name: Send link to Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
          LINK: ${{ steps.yandex.outputs.PUBLIC_URL }}
        run: |

          MESSAGE="*New Build Uploaded*
          
          Branch: ${GITHUB_REF_NAME}
          Commit: ${GITHUB_SHA::7}

          [Download from Yandex Disk]($LINK)"
          
          curl -v -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d "chat_id=$TG_CHAT_ID" \
            -d "message_thread_id=$TG_TOPIC_ID" \
            --data-urlencode "text=$MESSAGE" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=false"