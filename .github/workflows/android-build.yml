name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Generate local.properties
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          set -e
          if [ -z "$API_ID" ]; then echo "API_ID secret not set" >&2; exit 1; fi
          if [ -z "$API_HASH" ]; then echo "API_HASH secret not set" >&2; exit 1; fi

          cat > local.properties <<EOF
          api_id=$API_ID
          api_hash=$API_HASH
          EOF

      - name: Check gradlew
        run: |
          set -e
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found!" >&2
            exit 1
          fi
          chmod +x gradlew

      - name: Install NDK
        run: |
          set -e
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Resolve FFmpeg revision
        id: ffmpeg-rev
        run: echo "sha=$(git -C ffmpeg/src/main/cpp/ffmpeg rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Cache prebuilt FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ffmpeg/src/main/cpp/prebuilt
          key: ffmpeg-${{ runner.os }}-ndk27-${{ steps.ffmpeg-rev.outputs.sha }}-${{ hashFiles('ffmpeg/tools/build_ffmpeg.sh') }}

      - name: Build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash ffmpeg/tools/build_ffmpeg.sh

      - name: Build Debug and Release
        run: ./gradlew clean assembleDebug assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/**/release/*.apk
          if-no-files-found: warn

  telegram:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: apk

      - name: Upload to Yandex Disk and get public link
        id: yandex
        env:
          YD_TOKEN: ${{ secrets.YANDEX_TOKEN }}
        run: |
          set -e

          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          BASE_PATH="TelegramM/$SHORT_SHA"

          curl -X PUT -s -H "Authorization: OAuth $YD_TOKEN" \
            "https://cloud-api.yandex.net/v1/disk/resources?path=TelegramM" || true

          curl -X PUT -H "Authorization: OAuth $YD_TOKEN" \
            "https://cloud-api.yandex.net/v1/disk/resources?path=$BASE_PATH"

          for file in $(find apk -type f -name "*.apk"); do
            FILE_NAME=$(basename "$file")
          
            echo "Uploading $FILE_NAME..."

            UPLOAD_URL=$(curl -s -H "Authorization: OAuth $YD_TOKEN" \
              "https://cloud-api.yandex.net/v1/disk/resources/upload?path=$BASE_PATH/$FILE_NAME&overwrite=true" \
              | jq -r '.href')

            curl -T "$file" "$UPLOAD_URL"
          done

          curl -X PUT -H "Authorization: OAuth $YD_TOKEN" \
            "https://cloud-api.yandex.net/v1/disk/resources/publish?path=$BASE_PATH"

          PUBLIC_URL=$(curl -s -H "Authorization: OAuth $YD_TOKEN" \
            "https://cloud-api.yandex.net/v1/disk/resources?path=$BASE_PATH" \
            | jq -r '.public_url')

          echo "PUBLIC_URL=$PUBLIC_URL" >> $GITHUB_OUTPUT

      - name: Send link to Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
          LINK: ${{ steps.yandex.outputs.PUBLIC_URL }}
        run: |

          MESSAGE="*New Build Uploaded*
          
          Branch: ${GITHUB_REF_NAME}
          Commit: ${GITHUB_SHA::7}

          [Download from Yandex Disk]($LINK)"
          
          curl -v -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d "chat_id=$TG_CHAT_ID" \
            -d "message_thread_id=$TG_TOPIC_ID" \
            --data-urlencode "text=$MESSAGE" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=false"