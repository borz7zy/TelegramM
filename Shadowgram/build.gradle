plugins {
    alias(libs.plugins.android.application)
}

def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}

def gradleProps = new Properties()
def gradlePropsFile = rootProject.file("gradle.properties")
if (gradlePropsFile.exists()){
    gradleProps.load(new FileInputStream(gradlePropsFile))
}

android {
    namespace 'com.github.borz7zy.telegramm'
    compileSdk 36

    defaultConfig {
        applicationId "com.github.borz7zy.telegramm"
        minSdk 33
        targetSdk 36
        versionCode gradleProps.getProperty("app.versionCode").toInteger()
        versionName gradleProps.getProperty("app.version").toString()
        resValue "string", "api_id",
                localProps.getProperty("api_id", "")
        resValue "string", "api_hash",
                localProps.getProperty("api_hash", "")
        def testDc = localProps.getProperty("test_dc", "false").toBoolean()
        resValue "bool", "test_dc", testDc.toString()

        resValue "string", "app_name",
                gradleProps.getProperty("app.name", "Shadowgram")
        resValue "string", "version_code",
                gradleProps.getProperty("app.versionCode", "1")
        resValue "string", "version_name",
                gradleProps.getProperty("app.version", "0.0.0")


        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        defaultSignKey {
            storeFile file("../keystore/public.keystore")
            storePassword "123456"
            keyAlias "tgm-public-key"
            keyPassword "123456"
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.getByName("defaultSignKey")
        }
        debug {
            signingConfig = signingConfigs.getByName("defaultSignKey")
        }
    }
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            universalApk false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // The UI module carries the whole view layer and re-exports the core layer
    // (:SharedUtils) plus navigation, so this module only needs what App and
    // MainActivity touch directly.
    implementation project(':ShadowgramUI')

    implementation libs.appcompat
    implementation libs.material
    implementation libs.core
}